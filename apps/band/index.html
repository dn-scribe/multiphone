<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Phone Band</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none}
  #picker{display:flex;flex-direction:column;height:100%;padding:16px;gap:12px}
  #picker h1{font-size:32px;text-align:center;padding:8px 0}
  #picker p{text-align:center;font-size:16px;color:#ccc}
  #list{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;overflow:auto}
  .choice{border:3px solid #fff;border-radius:14px;background:#000;color:#fff;font-size:24px;font-weight:700;
          display:flex;align-items:center;justify-content:center;text-align:center;min-height:90px;padding:8px}
  .choice:active{background:#fff;color:#000}
  #stage{display:none;flex-direction:column;height:100%}
  #bar{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:3px solid #fff}
  #bar button{background:#000;color:#fff;border:3px solid #fff;border-radius:10px;font-size:18px;font-weight:700;padding:8px 14px}
  #title{flex:1;font-size:22px;font-weight:700;text-align:center}
  #pads{flex:1;display:grid;gap:10px;padding:10px}
  .pad{border-radius:18px;border:4px solid currentColor;display:flex;align-items:center;justify-content:center;
       font-size:34px;font-weight:800;transition:background .06s}
  .pad.on{background:currentColor}
  .pad.on span{color:#000}
</style>
</head>
<body>
<div id="picker">
  <h1>Phone Band</h1>
  <p>Each phone picks a part. Turn the volume up. All the notes are in the same key, so everything fits together.</p>
  <div id="list"></div>
</div>
<div id="stage">
  <div id="bar">
    <button id="back">◀ Back</button><a href="../../" style="color:#fff;font-size:18px;font-weight:700">Home</a>
    <div id="title"></div>
    <button id="lock">Lock</button>
  </div>
  <div id="pads"></div>
</div>
<script>
// ---------- Audio engine ----------
let ctx, master, noiseBuf;
function audio(){
  if(!ctx){
    ctx = new (window.AudioContext||window.webkitAudioContext)();
    const comp = ctx.createDynamicsCompressor();
    master = ctx.createGain(); master.gain.value = 0.9;
    master.connect(comp); comp.connect(ctx.destination);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }
  if(ctx.state==='suspended') ctx.resume();
  return ctx;
}
function env(g,t,peak,attack,decay){
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(peak,t+attack);
  g.gain.exponentialRampToValueAtTime(0.0001,t+attack+decay);
}
function osc(type,freq,t,dur,peak,endFreq){
  const o=ctx.createOscillator(), g=ctx.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  if(endFreq) o.frequency.exponentialRampToValueAtTime(endFreq,t+dur);
  env(g,t,peak,0.003,dur); o.connect(g); g.connect(master);
  o.start(t); o.stop(t+dur+0.05);
}
function noise(t,dur,peak,ftype,ffreq,q){
  const s=ctx.createBufferSource(), f=ctx.createBiquadFilter(), g=ctx.createGain();
  s.buffer=noiseBuf; f.type=ftype; f.frequency.value=ffreq; f.Q.value=q||1;
  env(g,t,peak,0.002,dur); s.connect(f); f.connect(g); g.connect(master);
  s.start(t); s.stop(t+dur+0.05);
}
const S = {
  kick:  t=>{osc('sine',160,t,0.45,1,40)},
  snare: t=>{noise(t,0.2,0.8,'highpass',1500);osc('triangle',220,t,0.1,0.4,160)},
  clap:  t=>{[0,0.012,0.024].forEach(d=>noise(t+d,0.12,0.6,'bandpass',1200,1.5))},
  hat:   t=>{noise(t,0.05,0.5,'highpass',8000)},
  openhat:t=>{noise(t,0.35,0.45,'highpass',7000)},
  crash: t=>{noise(t,1.4,0.5,'highpass',5000)},
  tomHi: t=>{osc('sine',260,t,0.3,0.9,160)},
  tomLo: t=>{osc('sine',140,t,0.4,0.9,80)},
  cowbell:t=>{osc('square',540,t,0.25,0.25);osc('square',800,t,0.25,0.2)},
  shaker:t=>{noise(t,0.09,0.4,'bandpass',6000,2)},
};
// Melodic voices. A minor pentatonic so any combination works.
function bass(f){return t=>{
  const o=ctx.createOscillator(), fl=ctx.createBiquadFilter(), g=ctx.createGain();
  o.type='sawtooth'; o.frequency.value=f; fl.type='lowpass';
  fl.frequency.setValueAtTime(1200,t); fl.frequency.exponentialRampToValueAtTime(150,t+0.4);
  env(g,t,0.7,0.005,0.6); o.connect(fl); fl.connect(g); g.connect(master); o.start(t); o.stop(t+0.7);
}}
function keys(f){return t=>{osc('triangle',f,t,0.9,0.5);osc('sine',f*2,t,0.5,0.15)}}
function bell(f){return t=>{osc('sine',f,t,1.5,0.4);osc('sine',f*2.76,t,0.6,0.12)}}
function pluck(f){return t=>{osc('square',f,t,0.3,0.18);osc('triangle',f,t,0.4,0.3)}}
const note = n => 440*Math.pow(2,(n-69)/12);   // MIDI number to Hz
const PENTA = [0,3,5,7,10];                       // A minor pentatonic
function scale(root,count){const r=[];for(let i=0;i<count;i++)r.push(root+PENTA[i%5]+12*Math.floor(i/5));return r}
const NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const nm = n => NAMES[n%12];

// ---------- Instruments ----------
// Strong colors on a black background
const C=['#ffeb3b','#00e5ff','#ff4081','#76ff03','#ff9100','#e040fb'];
const INSTRUMENTS = [
  {name:'Kick + Snare', cols:1, pads:[['KICK',S.kick],['SNARE',S.snare]]},
  {name:'Hi-hats',      cols:1, pads:[['HAT',S.hat],['OPEN',S.openhat]]},
  {name:'Toms',         cols:1, pads:[['HIGH',S.tomHi],['LOW',S.tomLo]]},
  {name:'Clap + Crash', cols:1, pads:[['CLAP',S.clap],['CRASH',S.crash]]},
  {name:'Cowbell + Shaker', cols:1, pads:[['BELL',S.cowbell],['SHAKE',S.shaker]]},
  {name:'Full Kit',     cols:2, pads:[['KICK',S.kick],['SNARE',S.snare],['HAT',S.hat],['CLAP',S.clap]]},
  {name:'Bass',         cols:2, pads:scale(33,4).map(n=>[nm(n),bass(note(n))])},
  {name:'Keys',         cols:2, pads:scale(57,6).map(n=>[nm(n),keys(note(n))])},
  {name:'Bells',        cols:2, pads:scale(69,6).map(n=>[nm(n),bell(note(n))])},
  {name:'Pluck',        cols:2, pads:scale(64,6).map(n=>[nm(n),pluck(note(n))])},
];

// ---------- UI ----------
const $=id=>document.getElementById(id);
const list=$('list'), pads=$('pads');
INSTRUMENTS.forEach((ins,i)=>{
  const b=document.createElement('button'); b.className='choice'; b.textContent=ins.name;
  b.onclick=()=>open(i); list.appendChild(b);
});
let wakeLock=null;
async function keepAwake(){try{wakeLock=await navigator.wakeLock?.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&$('stage').style.display==='flex')keepAwake()});

function open(i){
  audio(); keepAwake();
  const ins=INSTRUMENTS[i];
  $('title').textContent=ins.name;
  pads.innerHTML='';
  pads.style.gridTemplateColumns=`repeat(${ins.cols},1fr)`;
  ins.pads.forEach(([label,fn],k)=>{
    const p=document.createElement('div'); p.className='pad';
    p.style.color=C[k%C.length];
    p.innerHTML=`<span>${label}</span>`;
    p.addEventListener('pointerdown',e=>{
      e.preventDefault(); audio();
      fn(ctx.currentTime+0.001);
      navigator.vibrate?.(15);
      p.classList.add('on'); setTimeout(()=>p.classList.remove('on'),90);
    });
    pads.appendChild(p);
  });
  $('picker').style.display='none'; $('stage').style.display='flex';
  location.hash=i;
}
let locked=false;
$('lock').onclick=()=>{locked=!locked;$('lock').textContent=locked?'Unlock':'Lock';$('back').disabled=locked;$('back').style.opacity=locked?.3:1};
$('back').onclick=()=>{if(locked)return;$('stage').style.display='none';$('picker').style.display='flex';history.replaceState(null,'',location.pathname);wakeLock?.release?.()};
// A link such as index.html#6 opens that instrument straight away.
// Browsers only allow sound after a tap, so the first tap on a pad starts the audio.
if(location.hash.length>1){const i=+location.hash.slice(1);if(INSTRUMENTS[i])open(i)}
document.addEventListener('contextmenu',e=>e.preventDefault());
</script>
</body>
</html>
